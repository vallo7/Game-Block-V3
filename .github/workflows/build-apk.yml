name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prepare www assets (img, audio, music)
        run: |
          # img/ et audio/ vivent à la racine du dépôt (frères de www/),
          # mais Capacitor n'empaquette que webDir ("www"). On les copie
          # donc dans www/ avant tout build/sync, sans toucher à leur
          # emplacement dans le dépôt lui-même.
          mkdir -p www/img www/audio

          if [ -d img ]; then
            cp -R img/. www/img/
            echo "img/ copié dans www/img/"
          else
            echo "Attention : dossier img/ introuvable à la racine du dépôt."
          fi

          if [ -d audio ]; then
            cp -R audio/. www/audio/
            echo "audio/ copié dans www/audio/"
          else
            echo "Attention : dossier audio/ introuvable à la racine du dépôt."
          fi

          if [ -f www/audio/music.mp3 ]; then
            echo "music.mp3 trouvé dans audio/ (musique de fond)."
          else
            echo "Attention : audio/music.mp3 introuvable — la musique de fond utilisera le repli synthétisé."
          fi

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure AdMob App ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STRINGS="android/app/src/main/res/values/strings.xml"

          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<activity/i\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>' "$MANIFEST"
          fi

          if ! grep -q "admob_app_id" "$STRINGS"; then
            sed -i 's#</resources>#    <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>\n</resources>#' "$STRINGS"
          fi

          echo "AdMob App ID configured (test ID)."

      - name: Enable immersive mode
        run: |
          MJ=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package' "$MJ" | sed 's/package //;s/;//' | tr -d ' ')

          cat > "$MJ" << EOF
          package $PKG;

          import android.os.Handler;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private final Handler handler = new Handler();

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      handler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              hideSystemUI();
                          }
                      }, 2500);
                  }
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
          }
          EOF

          echo "Immersive mode enabled."

      - name: Install ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Generate crisp app icon
        run: |
          ICON_SRC=""
          if [ -f icon.png ]; then
            ICON_SRC="icon.png"
          elif [ -f img/icon.png ]; then
            ICON_SRC="img/icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            W=$(identify -format "%w" "$ICON_SRC")
            H=$(identify -format "%h" "$ICON_SRC")
            S=$(( W < H ? W : H ))

            convert "$ICON_SRC" -gravity center -crop ${S}x${S}+0+0 +repage /tmp/icon_square.png
            convert /tmp/icon_square.png -resize 1024x1024 /tmp/icon_1024.png

            for entry in "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
              set -- $entry
              px="$1"
              name="$2"
              dir="android/app/src/main/res/mipmap-$name"

              mkdir -p "$dir"
              convert /tmp/icon_1024.png -resize ${px}x${px} "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            done

            echo "Custom icon generated (source: $ICON_SRC)."
          else
            echo "icon.png not found (checked ./icon.png and img/icon.png), keeping default icon."
          fi

      - name: White native splash
        run: |
          rm -f android/app/src/main/res/drawable/splash.png
          rm -f android/app/src/main/res/drawable-port/splash.png
          rm -f android/app/src/main/res/drawable-land/splash.png

          cat > android/app/src/main/res/drawable/splash.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#FFFFFF" />
          </shape>
          EOF

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:background">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">#FFFFFF</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          echo "Native splash forced to white."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # L'étape "Setup Android SDK" (android-actions/setup-android@v3) a été
      # retirée : elle exécutait "sdkmanager tools" en interne pour
      # installer le paquet SDK legacy "tools", que Google a retiré de son
      # dépôt — l'action plante systématiquement depuis (exit code 1),
      # quel que soit le contenu du dépôt. Les runners GitHub Ubuntu ont
      # déjà un SDK Android préinstallé et fonctionnel (visible dans les
      # logs : "Found preinstalled sdkmanager..."), donc cette étape était
      # de toute façon redondante avec "Accept Android licenses" ci-dessous
      # et avec le téléchargement automatique des composants SDK manquants
      # que Gradle effectue lui-même pendant le build.

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-block-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
