<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>
<title>Game Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap"
rel="stylesheet"
/>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/background.css" />
<link rel="stylesheet" href="css/loading.css" />
<link rel="stylesheet" href="css/menu.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/overlays.css" />
<link rel="stylesheet" href="css/theme-page.css" />
<link rel="stylesheet" href="css/tutorial.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div id="app">
<div class="app-bg" id="appBg" aria-hidden="true">
<div class="app-bg-layer" id="appBgLayerA"></div>
<div class="app-bg-layer" id="appBgLayerB"></div>
</div>
<div class="theme-change-flash" id="themeChangeFlash" aria-hidden="true"></div>
<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
<div class="loading-content replay">
<img src="img/logo-gameblock.png" alt="Game Block" class="loading-logo" />
<div class="loading-loader" aria-hidden="true">
<span class="loading-loader-block" style="--i:0"></span>
<span class="loading-loader-block" style="--i:1"></span>
<span class="loading-loader-block" style="--i:2"></span>
<span class="loading-loader-block" style="--i:3"></span>
<span class="loading-loader-block" style="--i:4"></span>
</div>
<div class="loading-progress-track" aria-hidden="true">
<div class="loading-progress-fill" id="loadingProgressFill"></div>
</div>
</div>
</div>
<!-- MENU -->
<section id="menuScreen" class="screen active">
<div class="menu-hero">
<img src="img/logo-gameblock.png" alt="Game Block" class="menu-logo" />
</div>
<div class="ad-row">
<button id="adsBlockBtn" class="ads-block-btn">
<span class="ads-block-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="3" y="5" width="18" height="14" rx="3"></rect>
<path d="m9 9 6 6"></path>
<path d="m15 9-6 6"></path>
</svg>
</span>
<strong id="adsBlockLabel">REMOVE ADS</strong>
<span class="ads-shine" aria-hidden="true"></span>
</button>
</div>
<div class="mode-list">
<button id="classicModeBtn" class="mode-card-img">
<img src="img/ui/classic-button.png" alt="Classic" draggable="false" />
</button>
<button class="mode-card-img locked" disabled aria-label="Adventure — coming soon">
<img src="img/ui/adventure-button.png" alt="Adventure" draggable="false" />
</button>
</div>
<div class="bottom-actions-row">
<button id="homeSettingsBtn" class="quick-btn home-settings-btn" aria-label="Settings">
<svg viewBox="0 0 24 24" class="svg-icon">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
</button>
<button id="themeBtn" class="quick-btn theme-btn" aria-label="Themes">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H16a4 4 0 0 0 4-4c0-4.4-4-7.5-8-7.5Z"></path>
<circle cx="7.3" cy="10.5" r="1.15" fill="currentColor" stroke="none"></circle>
<circle cx="10.2" cy="7.3" r="1.15" fill="currentColor" stroke="none"></circle>
<circle cx="14.3" cy="7.3" r="1.15" fill="currentColor" stroke="none"></circle>
<circle cx="16.8" cy="10.8" r="1.15" fill="currentColor" stroke="none"></circle>
</svg>
</button>
</div>
</section>
<!-- HOME SETTINGS -->
<div id="homeSettingsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel">
<div class="settings-top">
<button id="homeSettingsBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
<div class="settings-title">Settings</div>
<button id="homeSettingsCloseBtn" class="mini-btn btn-close" aria-label="Close">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M6 6l12 12"></path>
<path d="M18 6 6 18"></path>
</svg>
</button>
</div>
<div class="settings-quick-row">
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
<path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
<path d="M18 6a8 8 0 0 1 0 12"></path>
</svg>
</div>
<span class="settings-row-label">Sound</span>
<label class="switch">
<input type="checkbox" data-setting="sound" aria-label="Sound" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
<div class="settings-row settings-row-slider">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M9 18V5l10-2v13"></path>
<circle cx="6" cy="18" r="3"></circle>
<circle cx="16" cy="16" r="3"></circle>
</svg>
</div>
<span class="settings-row-label">Music</span>
<input type="range" class="music-volume-slider" min="0" max="100" value="100" aria-label="Music volume" />
</div>
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="8" y="3" width="8" height="18" rx="2.5"></rect>
<path d="M4.5 8.5v7"></path>
<path d="M19.5 8.5v7"></path>
</svg>
</div>
<span class="settings-row-label">Vibrations</span>
<label class="switch">
<input type="checkbox" data-setting="vibration" aria-label="Vibrations" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
</div>
<div class="settings-about-row">
<button id="aboutUsBtn" class="about-us-btn">
<svg viewBox="0 0 24 24" class="svg-icon">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 11v5"></path>
<path d="M12 8h.01"></path>
</svg>
<span>About Us</span>
</button>
</div>
</div>
</div>
<!-- ABOUT US -->
<div id="aboutUsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel">
<div class="settings-top">
<span></span>
<div class="settings-title">About Us</div>
<button id="aboutUsBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
</div>
<div class="settings-about">
<img src="img/logo-gameblock.png" alt="Game Block" class="settings-about-logo" />
<p class="settings-about-text">Draw. Clear. Survive.</p>
<p class="settings-about-version">Game Block · v0.0.1</p>
</div>
</div>
</div>
<!-- RATE US -->
<div id="rateUsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel rate-us-panel">
<p class="rate-us-title">Enjoying Game Block?</p>
<div class="rate-us-stars" aria-hidden="true">
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
</div>
<p class="rate-us-text">A quick rating helps us a lot!</p>
<button id="rateUsBtn" class="rate-us-btn">Rate us</button>
<button id="rateUsDismissBtn" class="rate-us-dismiss">Maybe later</button>
</div>
</div>
<!-- GAME -->
<section id="gameScreen" class="screen">
<div class="game-top">
<button id="settingsBtn" class="top-btn" aria-label="Pause">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="6" y="4" width="4.5" height="16" rx="1.5"></rect>
<rect x="13.5" y="4" width="4.5" height="16" rx="1.5"></rect>
</svg>
</button>
<div class="best-score top-btn" aria-label="Best score">
<span class="best-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M8 21h8"></path>
<path d="M12 17v4"></path>
<path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"></path>
<path d="M17 5h2a2 2 0 0 1-2 4"></path>
<path d="M7 5H5a2 2 0 0 0 2 4"></path>
</svg>
</span>
<span id="bestScoreValue">0</span>
</div>
</div>
<div class="game-center">
<div class="board-frame">
<div class="score-wrap">
<div id="feedbackZone" class="feedback-zone">
<div id="comboBadge" class="combo-badge hidden">COMBO x2</div>
</div>
<div id="currentScore" class="current-score">0</div>
</div>
<div class="board-shell">
<canvas id="gameCanvas"></canvas>
<div id="haloWave" aria-hidden="true"></div>
</div>
<div class="available-row">
<div id="availablePill" class="available-pill">
<span class="available-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="5" y="5" width="14" height="14" rx="4"></rect>
<path d="M9.5 9.5h5v5h-5z"></path>
</svg>
</span>
<strong id="availableCount">0</strong>
</div>
</div>
</div>
</div>
</section>
<!-- THEME PAGE -->
<section id="themeScreen" class="screen theme-screen">
<div class="theme-page-header">
<button id="themeBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
<h2 class="theme-page-title">Themes</h2>
<span aria-hidden="true"></span>
</div>
<div class="theme-carousel-wrap">
<div class="theme-carousel" id="themeCarousel"></div>
<div class="theme-dots" id="themeDots"></div>
</div>
</section>
<!-- SETTINGS -->
<div id="settingsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel">
<div class="settings-top">
<button id="settingsHomeBtn" class="mini-btn btn-home" aria-label="Home">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M4 11.5 12 4l8 7.5"></path>
<path d="M7 10.5V19a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-8.5"></path>
</svg>
</button>
<div class="settings-title">Pause</div>
<button id="settingsCloseBtn" class="mini-btn btn-close" aria-label="Close">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M6 6l12 12"></path>
<path d="M18 6 6 18"></path>
</svg>
</button>
</div>
<div class="settings-quick-row">
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
<path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
<path d="M18 6a8 8 0 0 1 0 12"></path>
</svg>
</div>
<span class="settings-row-label">Sound</span>
<label class="switch">
<input type="checkbox" data-setting="sound" aria-label="Sound" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
<div class="settings-row settings-row-slider">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M9 18V5l10-2v13"></path>
<circle cx="6" cy="18" r="3"></circle>
<circle cx="16" cy="16" r="3"></circle>
</svg>
</div>
<span class="settings-row-label">Music</span>
<input type="range" class="music-volume-slider" min="0" max="100" value="100" aria-label="Music volume" />
</div>
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="8" y="3" width="8" height="18" rx="2.5"></rect>
<path d="M4.5 8.5v7"></path>
<path d="M19.5 8.5v7"></path>
</svg>
</div>
<span class="settings-row-label">Vibrations</span>
<label class="switch">
<input type="checkbox" data-setting="vibration" aria-label="Vibrations" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
</div>
<div class="settings-restart">
<button id="settingsRestartBtn" class="restart-game-btn">
<span class="restart-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
<path d="M20 4v5h-5"></path>
</svg>
</span>
<strong>RESTART</strong>
</button>
</div>
</div>
</div>
<!-- GAME OVER -->
<div id="gameOverOverlay" class="overlay hidden" aria-hidden="true">
<div class="gameover-panel">
<div class="defeat-msg">NO MORE MOVES!</div>
<div class="countdown-wrap">
<svg class="countdown-ring" viewBox="0 0 100 100">
<circle class="ring-bg" cx="50" cy="50" r="42"></circle>
<circle id="ringFg" class="ring-fg" cx="50" cy="50" r="42"></circle>
</svg>
<div id="countdownValue" class="countdown-value">10</div>
</div>
<div class="continue-msg">Watch an ad to continue!</div>
<div class="gameover-actions">
<button id="adsBtn" class="ads-btn">
<span class="ads-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="3" y="5" width="18" height="14" rx="3"></rect>
<path d="M10 9.5v5l4.5-2.5L10 9.5Z"></path>
</svg>
</span>
<strong>CONTINUE!</strong>
</button>
<button id="restartBtn" class="restart-btn">
<span class="restart-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
<path d="M20 4v5h-5"></path>
</svg>
</span>
<strong>RESTART</strong>
</button>
</div>
</div>
</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
