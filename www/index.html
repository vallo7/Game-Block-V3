<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>
<title>Game Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&display=swap"
rel="stylesheet"
/>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/background.css" />
<link rel="stylesheet" href="css/loading.css" />
<link rel="stylesheet" href="css/menu.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/overlays.css" />
<link rel="stylesheet" href="css/theme-page.css" />
<link rel="stylesheet" href="css/trophy-page.css" />
<link rel="stylesheet" href="css/marketplace-page.css" />
<link rel="stylesheet" href="css/tutorial.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div id="app">
<div class="app-bg" id="appBg" aria-hidden="true">
<div class="app-bg-layer" id="appBgLayerA"></div>
<div class="app-bg-layer" id="appBgLayerB"></div>
</div>
<div class="theme-change-flash" id="themeChangeFlash" aria-hidden="true"></div>
<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
<div class="loading-content replay">
<img src="img/logo-gameblock.png" alt="Game Block" class="loading-logo" />
<div class="loading-loader" aria-hidden="true">
<span class="loading-loader-block" style="--i:0"></span>
<span class="loading-loader-block" style="--i:1"></span>
<span class="loading-loader-block" style="--i:2"></span>
<span class="loading-loader-block" style="--i:3"></span>
<span class="loading-loader-block" style="--i:4"></span>
</div>
<div class="loading-progress-track" aria-hidden="true">
<div class="loading-progress-fill" id="loadingProgressFill"></div>
</div>
</div>
</div>
<!-- MENU -->
<section id="menuScreen" class="screen active">
<div class="top-stats-row">
<button id="coinCounterBtn" class="coin-counter" aria-label="Coins — Open Marketplace">
<svg viewBox="0 0 24 24" class="svg-icon coin-icon">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7.5 13.2 10.4 16.5 10.7 14 12.9 14.7 16.2 12 14.4 9.3 16.2 10 12.9 7.5 10.7 10.8 10.4Z" class="coin-star"></path>
</svg>
<span id="coinCounterValue">0</span>
<span class="coin-counter-plus" aria-hidden="true">+</span>
</button>
</div>
<div class="menu-hero">
<img src="img/logo-gameblock.png" alt="Game Block" class="menu-logo" />
</div>
<!-- Classic/Adventure : même langage visuel que les cartes de boost du
     panneau Second Chance (icône + nom, anneau marine, dégradé), en rose
     (Classic) / bleu (Adventure) échantillonnés sur le logo — voir
     --brand-pink/--brand-blue (css/base.css). Les deux PNG précédents
     (img/ui/classic-button.png, adventure-button.png) ne sont plus
     utilisés. Adventure reste verrouillé (écran pas encore prêt) : même
     traitement disabled qu'avant, juste reskinné. -->
<div class="mode-list">
<button id="classicModeBtn" class="mode-card mode-primary">
<span class="mode-shine" aria-hidden="true"></span>
<span class="mode-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M8 5v14l11-7Z"></path>
</svg>
</span>
<strong class="mode-name">CLASSIC</strong>
</button>
<button id="adventureModeBtn" class="mode-card mode-secondary locked" disabled aria-label="Adventure — coming soon">
<span class="mode-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M8 5v14l11-7Z"></path>
</svg>
</span>
<strong class="mode-name">ADVENTURE</strong>
</button>
</div>
<!-- Bannière basse (round de suivi) : simple contour sur son bord
     supérieur, posée tout en bas de l'écran d'accueil ; les boutons
     réglages/thèmes restent dans le flux normal juste au-dessus et se
     retrouvent donc visuellement posés dessus. -->
<div class="menu-bottom-bar" aria-hidden="true"></div>
<div class="bottom-actions-row">
<button id="homeSettingsBtn" class="quick-btn home-settings-btn" aria-label="Settings">
<svg viewBox="0 0 24 24" class="svg-icon">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
</button>
<button id="trophyBtn" class="quick-btn trophy-btn" aria-label="Trophies">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
<path d="M7 5H4.5A2.5 2.5 0 0 0 7 8.5"></path>
<path d="M17 5h2.5A2.5 2.5 0 0 1 17 8.5"></path>
<path d="M12 14v3"></path>
<path d="M9 20h6"></path>
<path d="M10.5 17h3l.5 2.2a1 1 0 0 1-1 1.3h-2a1 1 0 0 1-1-1.3z"></path>
</svg>
<span class="trophy-badge-dot" aria-hidden="true"></span>
</button>
<button id="marketplaceBtn" class="quick-btn marketplace-btn" aria-label="Marketplace">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M6 8h12l-1 12H7L6 8Z"></path>
<path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
</svg>
</button>
<button id="themeBtn" class="quick-btn theme-btn" aria-label="Themes">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H16a4 4 0 0 0 4-4c0-4.4-4-7.5-8-7.5Z"></path>
<circle cx="7.3" cy="10.5" r="1.15" fill="currentColor" stroke="none"></circle>
<circle cx="10.2" cy="7.3" r="1.15" fill="currentColor" stroke="none"></circle>
<circle cx="14.3" cy="7.3" r="1.15" fill="currentColor" stroke="none"></circle>
<circle cx="16.8" cy="10.8" r="1.15" fill="currentColor" stroke="none"></circle>
</svg>
</button>
</div>
</section>
<!-- HOME SETTINGS -->
<div id="homeSettingsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel">
<div class="settings-top">
<button id="homeSettingsBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
<div class="settings-title">Settings</div>
<button id="homeSettingsCloseBtn" class="mini-btn btn-close" aria-label="Close">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M6 6l12 12"></path>
<path d="M18 6 6 18"></path>
</svg>
</button>
</div>
<div class="settings-quick-row">
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
<path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
<path d="M18 6a8 8 0 0 1 0 12"></path>
</svg>
</div>
<span class="settings-row-label">Sound</span>
<label class="switch">
<input type="checkbox" data-setting="sound" aria-label="Sound" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
<div class="settings-row settings-row-slider">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M9 18V5l10-2v13"></path>
<circle cx="6" cy="18" r="3"></circle>
<circle cx="16" cy="16" r="3"></circle>
</svg>
</div>
<span class="settings-row-label">Music</span>
<input type="range" class="music-volume-slider" min="0" max="100" value="100" aria-label="Music volume" />
</div>
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="8" y="3" width="8" height="18" rx="2.5"></rect>
<path d="M4.5 8.5v7"></path>
<path d="M19.5 8.5v7"></path>
</svg>
</div>
<span class="settings-row-label">Vibrations</span>
<label class="switch">
<input type="checkbox" data-setting="vibration" aria-label="Vibrations" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
</div>
<div class="settings-about-row">
<button id="aboutUsBtn" class="about-us-btn">
<svg viewBox="0 0 24 24" class="svg-icon">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 11v5"></path>
<path d="M12 8h.01"></path>
</svg>
<span>About Us</span>
</button>
</div>
</div>
</div>
<!-- ABOUT US -->
<div id="aboutUsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel">
<div class="settings-top">
<span></span>
<div class="settings-title">About Us</div>
<button id="aboutUsBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
</div>
<div class="settings-about">
<img src="img/logo-gameblock.png" alt="Game Block" class="settings-about-logo" />
<p class="settings-about-text">Draw. Clear. Survive.</p>
<p class="settings-about-version">Game Block · v0.0.1</p>
</div>
</div>
</div>
<!-- RATE US -->
<div id="rateUsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel rate-us-panel">
<p class="rate-us-title">Enjoying Game Block?</p>
<div class="rate-us-stars" aria-hidden="true">
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
<svg viewBox="0 0 24 24" class="rate-us-star"><path d="M12 2 15 9 22 10 17 15 18 22 12 18.5 6 22 7 15 2 10 9 9Z"></path></svg>
</div>
<p class="rate-us-text">A quick rating helps us a lot!</p>
<button id="rateUsBtn" class="rate-us-btn">Rate us</button>
<button id="rateUsDismissBtn" class="rate-us-dismiss">Maybe later</button>
</div>
</div>
<!-- GAME -->
<section id="gameScreen" class="screen">
<div class="game-top">
<div class="game-top-left">
<button id="settingsBtn" class="top-btn" aria-label="Pause">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="6" y="4" width="4.5" height="16" rx="1.5"></rect>
<rect x="13.5" y="4" width="4.5" height="16" rx="1.5"></rect>
</svg>
</button>
<button id="gameCoinCounterBtn" class="coin-counter coin-counter-game" aria-label="Coins — Open Marketplace">
<svg viewBox="0 0 24 24" class="svg-icon coin-icon">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7.5 13.2 10.4 16.5 10.7 14 12.9 14.7 16.2 12 14.4 9.3 16.2 10 12.9 7.5 10.7 10.8 10.4Z" class="coin-star"></path>
</svg>
<span id="gameCoinCounterValue">0</span>
<span class="coin-counter-plus" aria-hidden="true">+</span>
</button>
</div>
<div class="best-score top-btn" aria-label="Best score">
<span class="best-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M8 21h8"></path>
<path d="M12 17v4"></path>
<path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"></path>
<path d="M17 5h2a2 2 0 0 1-2 4"></path>
<path d="M7 5H5a2 2 0 0 0 2 4"></path>
</svg>
</span>
<span id="bestScoreValue">0</span>
</div>
</div>
<div class="game-center">
<div class="board-frame">
<div class="score-wrap">
<div id="feedbackZone" class="feedback-zone">
<!-- Combo badge, étendu par les Phases 12/13 : la ligne du haut porte le
     libellé + la jauge Perfect Run (4 pips, 3/5/10/20 — purement dérivée
     de Game.combo, cf. core/game-rules.js#updatePerfectRun) ; la bande du
     bas est le combo meter, calé sur la même fenêtre que Game.comboUntil
     (#startComboMeter). Les deux n'existent que pendant que le badge
     combo lui-même est visible : aucun risque de chevaucher le badge
     praise, qui vit plus haut dans cette même zone. -->
<div id="comboBadge" class="combo-badge hidden">
<span class="combo-badge-row">
<span class="combo-badge-label">COMBO x2</span>
<span id="perfectRunGauge" class="perfect-run-gauge">
<span class="prg-pip" data-milestone="3"></span>
<span class="prg-pip" data-milestone="5"></span>
<span class="prg-pip" data-milestone="10"></span>
<span class="prg-pip" data-milestone="20"></span>
</span>
</span>
<span class="combo-meter-track"><span id="comboMeterFill" class="combo-meter-fill"></span></span>
</div>
</div>
<div id="currentScore" class="current-score">0</div>
</div>
<div class="board-shell">
<canvas id="gameCanvas"></canvas>
<div id="haloWave" aria-hidden="true"></div>
</div>
<div class="available-row">
<div id="availablePill" class="available-pill">
<span class="available-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="5" y="5" width="14" height="14" rx="4"></rect>
<path d="M9.5 9.5h5v5h-5z"></path>
</svg>
</span>
<strong id="availableCount">0</strong>
</div>
</div>
</div>
</div>
</section>
<!-- THEME PAGE -->
<section id="themeScreen" class="screen theme-screen">
<!-- Fond plein écran (round de suivi) : calque unique derrière tout
     l'écran, mis à jour au fil du swipe par
     services/visualtheme.js#updateScreenBg — remplace l'ancien fond par
     slide qui ne couvrait que la hauteur du carrousel, pas tout l'écran. -->
<div id="themeScreenBg" class="theme-screen-bg" aria-hidden="true"></div>
<div class="theme-page-header">
<button id="themeBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
<h2 class="theme-page-title">Themes</h2>
<span aria-hidden="true"></span>
</div>
<div class="theme-carousel-wrap">
<div class="theme-carousel" id="themeCarousel"></div>
<div class="theme-dots" id="themeDots"></div>
</div>
</section>
<!-- TROPHIES -->
<section id="trophyScreen" class="screen drawer-screen">
<div id="trophyScreenBg" class="drawer-screen-bg" aria-hidden="true"></div>
<div class="theme-page-header">
<button id="trophyBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
<h2 class="theme-page-title">Trophies</h2>
<span aria-hidden="true"></span>
</div>
<div class="trophy-scroll" id="trophyContent"></div>
</section>
<!-- MARKETPLACE -->
<section id="marketplaceScreen" class="screen drawer-screen">
<div id="marketplaceScreenBg" class="drawer-screen-bg" aria-hidden="true"></div>
<div class="theme-page-header">
<button id="marketplaceBackBtn" class="mini-btn btn-back" aria-label="Back">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M15 6 9 12l6 6"></path>
</svg>
</button>
<h2 class="theme-page-title">Marketplace</h2>
<span class="marketplace-header-coins">
<svg viewBox="0 0 24 24" class="svg-icon coin-icon">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7.5 13.2 10.4 16.5 10.7 14 12.9 14.7 16.2 12 14.4 9.3 16.2 10 12.9 7.5 10.7 10.8 10.4Z" class="coin-star"></path>
</svg>
<span id="marketplaceCoinValue">0</span>
</span>
</div>
<div class="marketplace-scroll" id="marketplaceContent"></div>
</section>
<!-- SETTINGS -->
<div id="settingsOverlay" class="overlay hidden" aria-hidden="true">
<div class="settings-panel">
<div class="settings-top">
<button id="settingsHomeBtn" class="mini-btn btn-home" aria-label="Home">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M4 11.5 12 4l8 7.5"></path>
<path d="M7 10.5V19a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-8.5"></path>
</svg>
</button>
<div class="settings-title">Pause</div>
<button id="settingsCloseBtn" class="mini-btn btn-close" aria-label="Close">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M6 6l12 12"></path>
<path d="M18 6 6 18"></path>
</svg>
</button>
</div>
<div class="settings-quick-row">
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
<path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
<path d="M18 6a8 8 0 0 1 0 12"></path>
</svg>
</div>
<span class="settings-row-label">Sound</span>
<label class="switch">
<input type="checkbox" data-setting="sound" aria-label="Sound" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
<div class="settings-row settings-row-slider">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M9 18V5l10-2v13"></path>
<circle cx="6" cy="18" r="3"></circle>
<circle cx="16" cy="16" r="3"></circle>
</svg>
</div>
<span class="settings-row-label">Music</span>
<input type="range" class="music-volume-slider" min="0" max="100" value="100" aria-label="Music volume" />
</div>
<div class="settings-row">
<div class="settings-row-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<rect x="8" y="3" width="8" height="18" rx="2.5"></rect>
<path d="M4.5 8.5v7"></path>
<path d="M19.5 8.5v7"></path>
</svg>
</div>
<span class="settings-row-label">Vibrations</span>
<label class="switch">
<input type="checkbox" data-setting="vibration" aria-label="Vibrations" />
<span class="switch-track"><span class="switch-thumb"></span></span>
</label>
</div>
</div>
<div class="settings-restart">
<!-- Réutilise exactement le balisage/style de la carte NEW GAME du
     panneau Second Chance (css/overlays.css, .boost-card.boost-tertiary)
     plutôt qu'un bouton "RESTART" dédié. -->
<button id="settingsRestartBtn" class="boost-card boost-tertiary">
<span class="boost-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
<path d="M20 4v5h-5"></path>
</svg>
</span>
<span class="boost-copy">
<strong class="boost-name">NEW GAME</strong>
<span class="boost-desc">Start a brand new run</span>
</span>
</button>
</div>
</div>
</div>
<!-- GAME OVER / SECOND CHANCE (roadmap Phase 8) : 3 cartes de boost au
     lieu du choix binaire Continue/Restart. Le countdown garde son rôle
     de filet de sécurité (action par défaut = NEW GAME, cf.
     core/game-flow.js#startGameOver). -->
<div id="gameOverOverlay" class="overlay hidden" aria-hidden="true">
<div class="gameover-panel">
<button id="gameOverCoinCounterBtn" class="coin-counter coin-counter-game coin-counter-corner" aria-label="Coins — Open Marketplace">
<svg viewBox="0 0 24 24" class="svg-icon coin-icon">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7.5 13.2 10.4 16.5 10.7 14 12.9 14.7 16.2 12 14.4 9.3 16.2 10 12.9 7.5 10.7 10.8 10.4Z" class="coin-star"></path>
</svg>
<span id="gameOverCoinCounterValue">0</span>
<span class="coin-counter-plus" aria-hidden="true">+</span>
</button>
<div class="defeat-msg">NO MORE MOVES!</div>
<div class="countdown-wrap">
<svg class="countdown-ring" viewBox="0 0 100 100">
<circle class="ring-bg" cx="50" cy="50" r="42"></circle>
<circle id="ringFg" class="ring-fg" cx="50" cy="50" r="42"></circle>
</svg>
<div id="countdownValue" class="countdown-value">12</div>
</div>
<div class="second-chance-title">CHOOSE YOUR COMEBACK</div>
<div class="boost-list">
<button id="secondWindBtn" class="boost-card boost-primary">
<span class="boost-shine" aria-hidden="true"></span>
<span class="boost-icon">
<svg viewBox="0 0 24 24" class="svg-icon">
<path d="M12 21C12 21 4 15.5 4 9.5C4 6.5 6.5 4 9.5 4C11 4 12 5 12 5C12 5 13 4 14.5 4C17.5 4 20 6.5 20 9.5C20 15.5 12 21 12 21Z"></path>
</svg>
</span>
<span class="boost-copy">
<strong class="boost-name">SECOND WIND</strong>
<span class="boost-desc">Clear the trouble blocks, keep your score</span>
</span>
<span class="boost-tag"><svg viewBox="0 0 24 24" class="boost-tag-icon"><path d="M8 5v14l11-7Z"></path></svg>AD</span>
</button>
<button id="freshBoardBtn" class="boost-card boost-secondary">
